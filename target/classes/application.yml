spring:
  batch:
    job:
      enabled: true
      name: creditRiskAnalysisJob
    jdbc:
      initialize-schema: always
    # Configuración de rendimiento
    chunk-size: 100
    max-threads: 4
    retry-policy:
      max-attempts: 3
      backoff:
        initial-interval: 1000
        multiplier: 2.0
        max-interval: 10000
  datasource:
    url: jdbc:h2:mem:creditriskdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

# Configuración de la aplicación
app:
  batch:
    input:
      file: classpath:input/credit-risk-data.csv
    output:
      file: classpath:output/credit-risk-results.csv
    risk:
      thresholds:
        low: 700
        medium: 600
        high: 500
      weights:
        credit-score: 0.4
        income: 0.2
        debt-ratio: 0.2
        payment-history: 0.2

# Configuración de logging
logging:
  level:
    root: INFO
    org.springframework.batch: DEBUG
    com.example.creditrisk: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/credit-risk-batch.log
    max-size: 10MB
    max-history: 30

# Configuración de métricas
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
